<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CLI Feature — Release Notes</title>
  <style>
    body { margin: 0; background: #0d1117; color: #e6edf3; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; display: grid; place-items: center; height: 100vh; }
    .window { width: 720px; background: #161b22; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5); overflow: hidden; }
    .bar { background: #21262d; padding: 10px 16px; font-size: 13px; color: #8b949e; }
    .content { padding: 24px; font-size: 15px; line-height: 1.6; }
    .prompt { color: #7ee787; }
    .cmd { color: #e6edf3; }
    .out { color: #79c0ff; opacity: 0; animation: fade 0.4s forwards; }
    .out:nth-child(3) { animation-delay: 1.2s; }
    .out:nth-child(4) { animation-delay: 1.8s; }
    @keyframes fade { to { opacity: 1; } }
    h1 { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); font-family: system-ui, sans-serif; font-size: 28px; font-weight: 600; margin: 0; opacity: 0; animation: slide 0.6s 0.2s forwards; }
    @keyframes slide { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
  </style>
</head>
<body>
  <h1>New CLI: `app deploy --preview`</h1>
  <div class="window" data-start="0" data-duration="8">
    <div class="bar">● ● ● &nbsp; terminal</div>
    <div class="content">
      <div class="prompt">$</div> <span class="cmd">app deploy --preview</span><br>
      <div class="out">✓ Building preview…</div>
      <div class="out">→ https://preview-abc123.app.dev</div>
    </div>
  </div>
</body>
</html>
